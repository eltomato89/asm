# ASM – Docker Compose example.
#
# 1. Generate the master key (once; keep it safe – without it all secrets are lost):
#      mkdir -p secrets && chmod 700 secrets
#      docker run --rm asm node apps/server/dist/scripts/generate-key.js > secrets/asm_master_key
#      chmod 600 secrets/asm_master_key && sudo chown 1000:1000 secrets/asm_master_key   # readable for user node (UID 1000)
#    secrets/ is excluded via .gitignore/.dockerignore – never commit it, never bake it into the image.
#    If the key lives outside this directory, adjust secrets.asm_master_key.file below.
# 2. Set ASM_PUBLIC_URL to the public https address and configure a reverse proxy (see below).
# 3. docker compose -f docker-compose.example.yml up -d
# 4. Get the setup token from the log: docker compose logs asm | grep "ASM setup token"

services:
  asm:
    image: asm
    # build: .
    restart: unless-stopped
    # Tiny init process as PID 1: forwards SIGTERM to Node (clean shutdown) and reaps zombies.
    init: true
    environment:
      ASM_PUBLIC_URL: https://asm.example.com
      ASM_MASTER_KEY_FILE: /run/secrets/asm_master_key
      # Required behind a reverse proxy: otherwise ASM only sees the proxy's IP as the client IP,
      # and the per-IP rate limits (login, setup, OAuth) hit all users together. Only set it if the
      # port is reachable exclusively through the proxy (otherwise X-Forwarded-For can be spoofed).
      # Number of proxy hops (or the proxy IPs/CIDRs). "true" trusts every X-Forwarded-For entry.
      ASM_TRUST_PROXY: "1"
      # ASM_AUTO_MODE_MAX_MIN: "240"
      # Standing approval per device: maximum days (0 turns the feature off).
      # ASM_STANDING_APPROVAL_MAX_DAYS: "90"
      # Agent-proposed standing approvals: maximum days an agent may propose (0 turns proposals off;
      # default min(14, ASM_STANDING_APPROVAL_MAX_DAYS); larger than that maximum fails at startup).
      # ASM_STANDING_REQUEST_MAX_DAYS: "14"
      # Push approval: allow only the approval page from outside (see README).
      # ASM_TRUSTED_NETWORKS: "192.168.0.0/16,100.64.0.0/10"
      # ASM_VAPID_SUBJECT: "mailto:admin@example.com"
    secrets:
      - asm_master_key
    volumes:
      - asm-data:/data
    # Reachable for the proxy only; without a proxy network bind e.g. to localhost:
    ports:
      - "127.0.0.1:8080:8080"
    # --- Traefik (v2/v3) ---------------------------------------------------------------------------
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.asm.rule=Host(`asm.example.com`)
    #   - traefik.http.routers.asm.entrypoints=websecure
    #   - traefik.http.routers.asm.tls.certresolver=letsencrypt
    #   - traefik.http.services.asm.loadbalancer.server.port=8080
    # networks: [proxy]

  # --- Caddy (alternative) ---------------------------------------------------------------------------
  # caddy:
  #   image: caddy:2
  #   restart: unless-stopped
  #   ports: ["80:80", "443:443"]
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #
  # Caddyfile:
  #   asm.example.com {
  #     reverse_proxy asm:8080 {
  #       # don't buffer SSE (live requests) and MCP long polls
  #       flush_interval -1
  #     }
  #   }

secrets:
  asm_master_key:
    file: ./secrets/asm_master_key

volumes:
  asm-data:
