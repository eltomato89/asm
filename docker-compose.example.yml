# ASM – Beispiel für Docker Compose.
#
# 1. Master-Key erzeugen (einmalig, sicher aufbewahren – ohne ihn sind alle Secrets verloren):
#      mkdir -p secrets && chmod 700 secrets
#      docker run --rm asm node apps/server/dist/scripts/generate-key.js > secrets/asm_master_key
#      chmod 600 secrets/asm_master_key && sudo chown 1000:1000 secrets/asm_master_key   # lesbar für User node (UID 1000)
#    secrets/ ist in .gitignore/.dockerignore ausgeschlossen – nie committen, nie ins Image bauen.
#    Liegt der Key außerhalb dieses Verzeichnisses, unten secrets.asm_master_key.file anpassen.
# 2. ASM_PUBLIC_URL auf die öffentliche https-Adresse setzen, Reverse Proxy konfigurieren (siehe unten).
# 3. docker compose -f docker-compose.example.yml up -d
# 4. Setup-Token aus dem Log holen: docker compose logs asm | grep "ASM setup token"

services:
  asm:
    image: asm
    # build: .
    restart: unless-stopped
    # Kleiner Init-Prozess als PID 1: leitet SIGTERM an Node weiter (sauberes Herunterfahren) und räumt Zombies ab.
    init: true
    environment:
      ASM_PUBLIC_URL: https://asm.example.com
      ASM_MASTER_KEY_FILE: /run/secrets/asm_master_key
      # Muss hinter einem Reverse Proxy gesetzt sein: sonst sieht ASM als Client-IP nur die IP des Proxys,
      # und die Rate-Limits pro IP (Login, Setup, OAuth) treffen alle Nutzer gemeinsam. Nur setzen, wenn
      # der Port ausschließlich über den Proxy erreichbar ist (X-Forwarded-For wird sonst fälschbar).
      # Anzahl der Proxy-Hops (oder die Proxy-IPs/CIDRs). "true" vertraut jedem X-Forwarded-For-Eintrag.
      ASM_TRUST_PROXY: "1"
      # ASM_AUTO_MODE_MAX_MIN: "240"
      # Push-Freigabe: von außen nur die Freigabe-Seite erlauben (siehe README).
      # ASM_TRUSTED_NETWORKS: "192.168.0.0/16,100.64.0.0/10"
      # ASM_VAPID_SUBJECT: "mailto:admin@example.com"
    secrets:
      - asm_master_key
    volumes:
      - asm-data:/data
    # Nur für den Proxy erreichbar; ohne Proxy-Netzwerk z. B. an localhost binden:
    ports:
      - "127.0.0.1:8080:8080"
    # --- Traefik (v2/v3) ---------------------------------------------------------------------------
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.asm.rule=Host(`asm.example.com`)
    #   - traefik.http.routers.asm.entrypoints=websecure
    #   - traefik.http.routers.asm.tls.certresolver=letsencrypt
    #   - traefik.http.services.asm.loadbalancer.server.port=8080
    # networks: [proxy]

  # --- Caddy (alternativ) ----------------------------------------------------------------------------
  # caddy:
  #   image: caddy:2
  #   restart: unless-stopped
  #   ports: ["80:80", "443:443"]
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #
  # Caddyfile:
  #   asm.example.com {
  #     reverse_proxy asm:8080 {
  #       # SSE (Live-Anfragen) und MCP-Long-Polls nicht puffern
  #       flush_interval -1
  #     }
  #   }

secrets:
  asm_master_key:
    file: ./secrets/asm_master_key

volumes:
  asm-data:
