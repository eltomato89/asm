name: Setup pnpm workspace
description: Install pnpm + Node 22 (with pnpm store cache) and install workspace dependencies.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 11.7.0
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      shell: bash
      # Fetch retries/timeout/concurrency come from pnpm-workspace.yaml (shared with the Docker build).
      run: pnpm install --frozen-lockfile
