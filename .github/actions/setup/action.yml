name: Setup pnpm workspace
description: Install pnpm + Node (default 24, with pnpm store cache) and install workspace dependencies.
inputs:
  node-version:
    description: Node.js version for actions/setup-node (the server needs 24; the CLI is also tested on 22).
    required: false
    default: '24'
runs:
  using: composite
  steps:
    # pnpm version comes from "packageManager" in the root package.json.
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - name: Install dependencies
      shell: bash
      # Fetch retries/timeout/concurrency come from pnpm-workspace.yaml (shared with the Docker build).
      run: pnpm install --frozen-lockfile
