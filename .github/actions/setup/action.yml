name: Setup pnpm workspace
description: Install pnpm + Node 24 (with pnpm store cache) and install workspace dependencies.
runs:
  using: composite
  steps:
    # pnpm version comes from "packageManager" in the root package.json.
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - name: Install dependencies
      shell: bash
      # Fetch retries/timeout/concurrency come from pnpm-workspace.yaml (shared with the Docker build).
      run: pnpm install --frozen-lockfile
