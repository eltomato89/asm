name: Setup pnpm workspace
description: Install pnpm + Node 22 (with pnpm store cache) and install workspace dependencies.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 11.7.0
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      shell: bash
      # pnpm 11 ignores these keys in .npmrc and npm_config_* env; pnpm_config_* env vars are honored.
      env:
        pnpm_config_fetch_retries: "5"
        pnpm_config_fetch_timeout: "120000"
        pnpm_config_network_concurrency: "8"
      run: pnpm install --frozen-lockfile
