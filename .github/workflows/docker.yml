name: Docker

# - tag push v*.*.*       -> run tests here, then push <version>, <major>.<minor>, latest
# - CI succeeded on main  -> push edge + sha-<short> (tests already ran in CI)
# - workflow_dispatch     -> run tests, then push tags matching the selected ref
on:
  push:
    tags: ["v*.*.*"]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/eltomato89/asm

jobs:
  test:
    # Tag pushes, and manual runs from main or a v* tag only (a feature-branch dispatch must not publish).
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    uses: ./.github/workflows/_test.yml

  image:
    needs: test
    # Runs when tests passed in this workflow, or (workflow_run) when CI on a push to main succeeded.
    if: >-
      always() && (
        needs.test.result == 'success' ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      # workflow_run runs on the default branch HEAD; build exactly the commit CI tested.
      BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_SHA }}
          persist-credentials: false

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # source links the GHCR package to the repo (repo-based access permissions, not visibility).
          labels: |
            org.opencontainers.image.source=https://github.com/eltomato89/asm
            org.opencontainers.image.revision=${{ env.BUILD_SHA }}
            org.opencontainers.image.title=ASM
            org.opencontainers.image.description=Agent Secrets Manager
          # Prerelease tags (v1.0.0-rc.1) get only {{version}}; latest only for plain vX.Y.Z.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=edge,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=sha-${{ steps.sha.outputs.short }},enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
