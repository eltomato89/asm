name: Test (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @asm/shared build
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @asm/web build
      - run: pnpm --filter @asm/cli bundle
